<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Venue Ops 8500 logo</title>
  <desc id="desc">A control-room style venue map mark with an arena bowl, stage, service routes, and Venue Ops 8500 text.</desc>
  <defs>
