      <stop offset="0" stop-color="#35c9ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#071018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
